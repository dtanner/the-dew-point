# XcodeGen project definition. The .xcodeproj is generated from this file and is
# git-ignored — run `just generate` after cloning or changing this file. Keeping
# the project declarative here avoids pbxproj merge conflicts.
name: TheDewPoint

options:
  bundleIdPrefix: com.dantanner
  createIntermediateGroups: true
  # Config/Secrets.xcconfig is git-ignored (`just generate` seeds it from the
  # example); don't fail generation on a fresh clone before it exists — an
  # unresolved $(AIRNOW_API_KEY) just substitutes to empty at build time.
  disabledValidations: [missingConfigFiles]
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"

settings:
  base:
    DEVELOPMENT_TEAM: 72SPM7GVK7
    # Explicit so the new complication target also goes through automatic
    # provisioning — otherwise Xcode falls back to a generic wildcard profile that
    # doesn't include the watch (and isn't WeatherKit-capable) and the device build
    # fails. `just deploy` passes -allowProvisioningUpdates to register the new App ID.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.4"
    CURRENT_PROJECT_VERSION: "11"

packages:
  DewPoint:
    path: .

targets:
  # The iPhone app — the unit App Store Connect distributes. It carries the
  # existing App Store record's bundle ID (this slot used to be an
  # executable-less container for the watch-only app) and embeds the watch app
  # under Watch/. The watch app still runs on its own (see
  # WKRunsIndependentlyOfCompanionApp), so it installs without this one.
  # `just release` archives THIS target.
  TheDewPointPhone:
    type: application
    platform: iOS
    sources:
      - Phone
      # App-level code shared with the watch app: the conditions model, the
      # data-source wiring, and DEBUG fakes.
      - AppCore
      - Shared
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dantanner.dewpoint
        PRODUCT_NAME: TheDewPoint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only for now; iPad would need its own layout pass.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: The Dew Point
        # Must match the embedded watch app's version or validation rejects it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only exempt encryption (HTTPS) — answers the export-compliance question
        # so TestFlight builds don't sit in "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: The Dew Point uses your location to fetch the local temperature and dew point.
        AirNowAPIKey: $(AIRNOW_API_KEY)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Phone/TheDewPointPhone.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # The group name matches the watch's, but the two devices each have their
        # own container: nothing here is shared with the watch.
        com.apple.security.application-groups:
          - group.com.dantanner.dewpoint
        # iCloud key-value storage for custom words. One explicit store ID shared
        # with the watch app: the default is per bundle ID, and the two differ.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.dantanner.dewpoint
    dependencies:
      - package: DewPoint
        product: ThermalComfort
      - package: DewPoint
        product: WeatherData
      # Embeds the watch app under Watch/ so the one App Store record ships both.
      - target: TheDewPoint

  TheDewPoint:
    type: application
    platform: watchOS
    sources:
      - App
      # App-level code shared with the iPhone app.
      - AppCore
      # UI code compiled into both the app and the complication (e.g. the AQI
      # severity colors) so the two renderings can't drift apart.
      - Shared
    # Carries AIRNOW_API_KEY (air quality complication) into the build without it
    # living in this public repo; the key reaches the code via the AirNowAPIKey
    # Info.plist entry below.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dantanner.dewpoint.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        # A single-target watchOS app with an iPhone companion that it doesn't
        # need: it installs and runs on its own, as it did when it was watch-only.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dantanner.dewpoint
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleDisplayName: The Dew Point
        # Versions come from the build settings above, bumped by `just release`.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: The Dew Point uses your location to fetch the local temperature and dew point.
        AirNowAPIKey: $(AIRNOW_API_KEY)
    entitlements:
      path: App/TheDewPoint.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # Shared storage so the app can hand its latest reading to the complication.
        com.apple.security.application-groups:
          - group.com.dantanner.dewpoint
        # Same iCloud key-value store as the iPhone app, so custom words sync.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.dantanner.dewpoint
    dependencies:
      - package: DewPoint
        product: ThermalComfort
      - package: DewPoint
        product: WeatherData
      # Embeds the complication extension so it ships (and deploys) with the app.
      - target: DewPointComplication

  # WidgetKit extension hosting the two complications. Reuses the same packages as
  # the app and fetches its own conditions on a timeline (see ComfortProvider).
  DewPointComplication:
    type: app-extension
    platform: watchOS
    sources:
      - Complication
      - Shared
    # Same AirNow key wiring as the app — the widget extension is a separate
    # process with its own bundle, so it needs its own copy of the key.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dantanner.dewpoint.watchkitapp.widget
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: The Dew Point
        # Must match the app's version or App Store validation rejects the build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        AirNowAPIKey: $(AIRNOW_API_KEY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Complication/DewPointComplication.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # Same group as the app — this is how the widget reads the app's reading.
        com.apple.security.application-groups:
          - group.com.dantanner.dewpoint
    dependencies:
      - package: DewPoint
        product: ThermalComfort
      - package: DewPoint
        product: WeatherData
